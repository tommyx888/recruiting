<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <title data-translate="Set new password">Nastaviť nové heslo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-screen" id="reset-password-screen">
        <div class="login-screen-bg" aria-hidden="true"></div>
        <div class="login-card card" id="reset-password-card">
            <div class="logo">
                <img src="artifex-logo.png" alt="Artifex logo" class="artifex-logo">
            </div>
            <h2 class="login-title" data-translate="Set new password">Set new password</h2>
            <p class="login-subtitle" data-translate="Recruiting Management System">Recruiting Management System</p>
            <p class="login-help-text" id="reset-email-hint" hidden></p>
            <form id="reset-password-form" class="login-form-inner">
                <div class="input-group">
                    <input type="password" id="reset-new-password" data-translate-placeholder="New Password" placeholder="New Password" required autocomplete="new-password" minlength="8">
                </div>
                <div class="input-group">
                    <input type="password" id="reset-confirm-password" data-translate-placeholder="Confirm New Password" placeholder="Confirm New Password" required autocomplete="new-password" minlength="8">
                </div>
                <p class="login-form-error" id="reset-password-error" role="alert"></p>
                <button type="submit" class="btn btn-primary btn-login" id="reset-submit-btn" data-translate="Save new password">Save new password</button>
            </form>
            <p class="login-forgot-wrap">
                <a href="index.html" class="login-forgot-link" data-translate="Back to login">Back to login</a>
            </p>
            <div class="reset-lang-row" id="reset-lang-row">
                <button type="button" class="reset-lang-btn" data-lang="sk">SK</button>
                <span class="reset-lang-sep">|</span>
                <button type="button" class="reset-lang-btn" data-lang="en">EN</button>
            </div>
        </div>
        <div class="login-card card" id="reset-invalid" hidden>
            <div class="logo">
                <img src="artifex-logo.png" alt="Artifex logo" class="artifex-logo">
            </div>
            <h2 class="login-title" data-translate="Reset link invalid">Reset link invalid</h2>
            <p class="login-help-text" data-translate="Invalid or expired reset link. Please request a new reset email from the login page.">
                Invalid or expired reset link. Please request a new reset email from the login page.
            </p>
            <a href="index.html" class="btn btn-primary btn-login" style="display:inline-block;text-align:center;text-decoration:none;box-sizing:border-box;" data-translate="Back to login">Back to login</a>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
